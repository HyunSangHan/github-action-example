name: 06 Passing Data Between Steps
on:
  workflow_dispatch:
jobs:
  data-passing:
    runs-on: ubuntu-22.04
    steps:
      - name: Create data
        id: any-id
        # this step will set the output name for this step to Michal
        run: |
          echo "name=Hyunsang" >> $GITHUB_OUTPUT
      - name: Receive data
        run: |
          echo ${{ steps.any-id.outputs.name }}
